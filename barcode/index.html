<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="在线条形码生成工具, 支持CODE128/EAN/ISBN等格式, 免费在线条形码制作工具">
    <meta name="keywords" content="条形码生成, CODE128, EAN, ISBN, 条形码制作, 在线条形码, 免费工具">
    <meta name="author" content="余一叶知秋尽">
    <link rel="icon" href="../common/img/helpoke.webp" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index,follow,noai">
    <title>条形码生成工具 - Helpoke 助点站</title>
    <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2048978820706528" crossorigin="anonymous"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script> -->
    <script src="./lib/JsBarcode.all.min.js"></script>
    <style>
        @import '../common/css/style.css';
        @import '../common/css/utils.css';
    </style>
    <style>
        .container {
            padding: 40px 20px;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .tool-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 32px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
        }

        .options-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .option-item {
            flex: 1;
            min-width: 150px;
        }

        .option-item label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-download {
            background-color: #27ae60;
        }

        .btn-download:hover {
            background-color: #229954;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .barcode-preview {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #ddd;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .barcode-preview svg {
            max-width: 100%;
            height: auto;
        }

        .barcode-placeholder {
            color: #aaa;
            font-size: 14px;
        }

        .barcode-info {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .barcode-value {
            font-family: 'Consolas', monospace;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            margin-top: 5px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
        }

        .format-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .tool-card {
                padding: 20px;
                margin: 0 10px;
            }

            .options-row {
                flex-direction: column;
            }

            .actions-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

        /* ==================== 夜间模式样式 ==================== */
        body.dark-mode .tool-card {
            background-color: var(--bg-card);
            box-shadow: var(--box-shadow);
        }

        body.dark-mode .input-group label {
            color: var(--text-primary);
        }

        body.dark-mode input[type="text"],
        body.dark-mode select {
            background-color: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        body.dark-mode input[type="text"]:focus,
        body.dark-mode select:focus {
            border-color: var(--primary-color);
        }

        body.dark-mode .option-item label {
            color: var(--text-secondary);
        }

        body.dark-mode .btn {
            background-color: var(--primary-color);
        }

        body.dark-mode .btn:hover {
            background-color: var(--primary-hover);
        }

        body.dark-mode .btn-download {
            background-color: var(--success-color);
        }

        body.dark-mode .btn-download:hover {
            background-color: #059669;
        }

        body.dark-mode .barcode-preview {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
        }

        body.dark-mode .barcode-placeholder {
            color: var(--text-muted);
        }

        body.dark-mode .barcode-info {
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        body.dark-mode .barcode-value {
            color: var(--text-primary);
        }

        body.dark-mode .error-msg {
            color: var(--error-color);
        }

        body.dark-mode .format-hint {
            color: var(--text-muted);
        }

        /* ==================== 边框颜色覆盖 ==================== */
        body.dark-mode .barcode-preview {
            border-color: var(--border-color);
        }

        body.dark-mode .barcode-info {
            border-color: var(--border-color);
        }

        body.dark-mode input[type="text"],
        body.dark-mode input[type="number"] {
            border-color: var(--border-color);
        }

        body.dark-mode select {
            border-color: var(--border-color);
        }

        body.dark-mode .copy-btn {
            border-color: var(--border-color);
        }
    </style>
</head>

<body>
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1>条形码生成工具（<a href="/" title="返回首页">🏠</a>）</h1>
            <p>在线 Barcode Generator，支持 CODE128/EAN/ISBN 等多种格式</p>
        </section>

        <div class="container">
            <div class="tool-card">
                <div class="input-group">
                    <label for="barcode-value">条形码内容</label>
                    <input type="text" id="barcode-value" placeholder="输入条形码内容，如：1234567890128">
                    <div class="format-hint" id="format-hint"></div>
                </div>

                <div class="options-row">
                    <div class="option-item">
                        <label>条形码格式</label>
                        <select id="barcode-format">
                            <option value="CODE128">CODE128（通用）</option>
                            <option value="EAN13">EAN-13（商品）</option>
                            <option value="EAN8">EAN-8（小型商品）</option>
                            <option value="UPC">UPC-A（美国）</option>
                            <option value="CODE39">CODE39</option>
                            <option value="ITF14">ITF-14（物流）</option>
                            <option value="MSI">MSI</option>
                            <option value="pharmacode">Pharmacode</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label>显示值</label>
                        <select id="show-value">
                            <option value="true">显示</option>
                            <option value="false">隐藏</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label>宽度</label>
                        <select id="barcode-width">
                            <option value="1">细</option>
                            <option value="2" selected>正常</option>
                            <option value="3">宽</option>
                        </select>
                    </div>
                    <div class="option-item">
                        <label>高度</label>
                        <select id="barcode-height">
                            <option value="50">矮 (50px)</option>
                            <option value="80" selected>正常 (80px)</option>
                            <option value="120">高 (120px)</option>
                            <option value="150">超高 (150px)</option>
                        </select>
                    </div>
                </div>

                <div class="actions-row">
                    <button class="btn" id="generate-btn">生成条形码</button>
                    <button class="btn btn-download" id="download-btn" style="display: none;">下载 PNG</button>
                </div>

                <div class="barcode-preview" id="barcode-preview">
                    <div class="barcode-placeholder">输入内容后点击"生成条形码"</div>
                </div>

                <div class="barcode-info" id="barcode-info" style="display: none;">
                    <div>格式：<span id="info-format"></span></div>
                    <div>内容：<span class="barcode-value" id="info-value"></span></div>
                    <div>宽度：<span id="info-width"></span>px</div>
                    <div>高度：<span id="info-height"></span>px</div>
                </div>
            </div>
        </div>
        <div id="footer-container"></div>
    </main>

    <script src="../common/js/theme.js"></script>
    <script src="../common/js/nav.js"></script>
    <script src="script.js"></script>
</body>

</html>
