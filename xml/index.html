    <script>
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function getInput() {
            return document.getElementById('input-xml').value;
        }

        function setOutput(val) {
            document.getElementById('output-xml').value = val;
            updateStats(val);
        }

        function updateStats(val) {
            document.getElementById('stat-chars').textContent = val.length;
            document.getElementById('stat-lines').textContent = val ? val.split('\n').length : 0;
        }

        function escapeXml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }

        // 格式化 XML —— DOM 递归缩进
        function formatXmlNode(node, depth) {
            var prefix = '';
            for (var i = 0; i < depth; i++) prefix += '  ';

            if (node.nodeType === 1) {
                var tag = '<' + node.nodeName;
                for (var a = 0; a < node.attributes.length; a++) {
                    var attr = node.attributes[a];
                    tag += ' ' + attr.name + '="' + escapeXml(attr.value) + '"';
                }

                var hasChild = node.childNodes.length > 0;
                var hasElem = false;
                for (var c = 0; c < node.childNodes.length; c++) {
                    if (node.childNodes[c].nodeType === 1) { hasElem = true; break; }
                }

                if (!hasChild) {
                    return prefix + tag + '/>';
                }
                if (!hasElem) {
                    var txt = node.textContent || '';
                    return prefix + tag + '>' + txt + '</' + node.nodeName + '>';
                }

                var lines = [prefix + tag + '>'];
                for (var d = 0; d < node.childNodes.length; d++) {
                    var childLine = formatXmlNode(node.childNodes[d], depth + 1);
                    if (childLine) lines.push(childLine);
                }
                lines.push(prefix + '</' + node.nodeName + '>');
                return lines.join('\n');
            }
            if (node.nodeType === 4) {
                return prefix + '<![CDATA[' + node.nodeValue + ']]>';
            }
            if (node.nodeType === 8) {
                return prefix + '<!--' + node.nodeValue + '-->';
            }
            return '';
        }

        function formatXml(xml) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(xml, 'text/xml');
            var err = doc.querySelector('parsererror');
            if (err) throw new Error(err.textContent.replace(/\n/g, ' '));
            var decl = '';
            if (doc.xmlVersion) {
                decl = '<?xml version="' + doc.xmlVersion + '" encoding="UTF-8"?>';
            }
            var body = formatXmlNode(doc.documentElement, 0);
            return decl ? decl + '\n' + body : body;
        }

        function doFormat() {
            hideError();
            var xml = getInput().trim();
            if (!xml) { showError('请输入 XML 内容'); return; }
            try {
                setOutput(formatXml(xml));
            } catch (e) {
                showError('XML 解析错误: ' + e.message);
            }
        }

        // 压缩 XML
        function doMinify() {
            hideError();
            var xml = getInput().trim();
            if (!xml) { showError('请输入 XML 内容'); return; }
            try {
                var parser = new DOMParser();
                var doc = parser.parseFromString(xml, 'text/xml');
                var err = doc.querySelector('parsererror');
                if (err) {
                    showError('XML 解析错误: ' + err.textContent.replace(/\n/g, ' ').substring(0, 200));
                    return;
                }
                var serializer = new XMLSerializer();
                var minified = serializer.serializeToString(doc);
                // 去除声明与根元素之间的空白
                minified = minified.replace(/>\s+</g, '><');
                minified = minified.replace(/\?>\s+</g, '?><');
                setOutput(minified);
            } catch (e) {
                showError('压缩失败: ' + e.message);
            }
        }

        // XML → JSON（属性直接放对象上，文本内容用 value 键）
        function xmlToJson(xml) {
            var obj = {};

            if (xml.nodeType === 3 || xml.nodeType === 4) {
                return xml.nodeValue.trim() || '';
            }

            if (xml.nodeType === 1) {
                // 属性直接放到对象上
                for (var j = 0; j < xml.attributes.length; j++) {
                    var attr = xml.attributes.item(j);
                    obj[attr.nodeName] = attr.nodeValue;
                }

                var hasElementChild = false;
                for (var i = 0; i < xml.childNodes.length; i++) {
                    if (xml.childNodes[i].nodeType === 1) { hasElementChild = true; break; }
                }

                if (!hasElementChild) {
                    var text = xml.textContent;
                    if (Object.keys(obj).length === 0) return text;
                    obj.value = text;
                    return obj;
                }

                for (var i = 0; i < xml.childNodes.length; i++) {
                    var child = xml.childNodes[i];
                    if (child.nodeType === 3) {
                        var tv = child.nodeValue.trim();
                        if (tv) obj.value = (obj.value || '') + tv;
                        continue;
                    }
                    if (child.nodeType !== 1) continue;
                    var nodeName = child.nodeName;
                    var childObj = xmlToJson(child);
                    if (obj[nodeName] === undefined) {
                        obj[nodeName] = childObj;
                    } else {
                        if (!Array.isArray(obj[nodeName])) {
                            obj[nodeName] = [obj[nodeName]];
                        }
                        obj[nodeName].push(childObj);
                    }
                }
            }

            return obj;
        }

        function doXml2Json() {
            hideError();
            var xml = getInput().trim();
            if (!xml) { showError('请输入 XML 内容'); return; }
            try {
                var parser = new DOMParser();
                var doc = parser.parseFromString(xml, 'text/xml');
                var err = doc.querySelector('parsererror');
                if (err) {
                    showError('XML 解析错误: ' + err.textContent.replace(/\n/g, ' ').substring(0, 200));
                    return;
                }
                var result = xmlToJson(doc.documentElement);
                var wrapper = {};
                wrapper[doc.documentElement.nodeName] = result;
                setOutput(JSON.stringify(wrapper, null, 2));
            } catch (e) {
                showError('转换失败: ' + e.message);
            }
        }

        // JSON → XML（value 键→文本内容，基础类型→属性，对象/数组→子元素）
        function jsonToXml(obj, rootName) {
            rootName = rootName || 'root';

            function buildXml(obj, nodeName, indent) {
                indent = indent || '';
                if (obj === null || obj === undefined) return '';

                if (typeof obj !== 'object') {
                    return indent + '<' + nodeName + '>' + escapeXml(String(obj)) + '</' + nodeName + '>\n';
                }

                if (Array.isArray(obj)) {
                    var arrXml = '';
                    for (var i = 0; i < obj.length; i++) {
                        arrXml += buildXml(obj[i], nodeName, indent);
                    }
                    return arrXml;
                }

                var attrs = '';
                var textVal = '';
                var children = '';

                var keys = Object.keys(obj);
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    var v = obj[k];
                    if (k === 'value') {
                        textVal = escapeXml(String(v));
                    } else if (typeof v === 'object' && v !== null) {
                        if (Array.isArray(v)) {
                            for (var j = 0; j < v.length; j++) {
                                children += buildXml(v[j], k, indent + '  ');
                            }
                        } else {
                            children += buildXml(v, k, indent + '  ');
                        }
                    } else {
                        attrs += ' ' + k + '="' + escapeXml(String(v)) + '"';
                    }
                }

                if (!children && !textVal) {
                    return indent + '<' + nodeName + attrs + '/>\n';
                }
                if (!children) {
                    return indent + '<' + nodeName + attrs + '>' + textVal + '</' + nodeName + '>\n';
                }
                return indent + '<' + nodeName + attrs + '>\n' + children + indent + '</' + nodeName + '>\n';
            }

            if (typeof obj === 'object' && !Array.isArray(obj)) {
                var rootKeys = Object.keys(obj);
                if (rootKeys.length === 1) {
                    rootName = rootKeys[0];
                    obj = obj[rootName];
                }
            }

            return '<?xml version="1.0" encoding="UTF-8"?>\n' + buildXml(obj, rootName).trimEnd();
        }

        function doJson2Xml() {
            hideError();
            var input = getInput().trim();
            if (!input) { showError('请输入 JSON 内容'); return; }
            try {
                var obj = JSON.parse(input);
                var xml = jsonToXml(obj);
                setOutput(xml);
            } catch (e) {
                showError('JSON 解析错误: ' + e.message);
            }
        }

        function doClear() {
            hideError();
            document.getElementById('input-xml').value = '';
            document.getElementById('output-xml').value = '';
            updateStats('');
        }

        function doCopy() {
            var text = document.getElementById('output-xml').value;
            navigator.clipboard.writeText(text).then(function () {
                utils.showSuccess('已复制到剪贴板！');
            }).catch(function () {
                utils.showError('复制失败，请手动复制');
            });
        }

        // 快捷键 Ctrl+Enter 格式化
        document.getElementById('input-xml').addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                doFormat();
            }
        });

        // 初始格式化
        doFormat();
    </script>
