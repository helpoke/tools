        .container {
            max-width: 100%;
            padding: 40px 0;
        }

        .tool-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);

        .tabs {
            display: flex;

            margin-bottom: 24px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #3498db;

        .tab-btn.active {

        .input-group {

        .input-group label {

        .input-group textarea {

        }

        .input-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;

            cursor: pointer;

            white-space: nowrap;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-outline {
            background: white;
            color: #3498db;
            border: 1px solid #3498db;
        }

        .btn-outline:hover {
            background: #f0f7ff;

        .btn-copy {
            background-color: #27ae60;
        }

        .btn-copy:hover {
            background-color: #229954;
        }

        .btn-copy.copied {

        .btn-swap {
            background: #f8f9fa;

            transition: all 0.2s;

        .actions-row {
            display: flex;

        .mode-toggle {

            gap: 0;

        .mode-toggle button {

            transition: all 0.2s;
        }

        .mode-toggle button:first-child {
            border-radius: 6px 0 0 6px;
        }

        .mode-toggle button:last-child {
            border-radius: 0 6px 6px 0;
            border-left: none;
        }

        .mode-toggle button.active {
            background: #3498db;
            color: white;

        }

        .char-count {
            font-size: 12px;
            color: #7f8c8d;

        @media (max-width: 768px) {

                flex-direction: column;

        }

        @media (max-width: 480px) {

<body>
    <!-- Navigation component container -->
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1>URL 编码 / 解码工具</h1>
            <p>在线 URL Encode / Decode，支持 encodeURI 和 encodeURIComponent 两种模式</p>
        </section>

        <div class="container">
            <div class="tool-card">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('encode')">URL 编码</button>
                    <button class="tab-btn" onclick="switchTab('decode')">URL 解码</button>
                </div>

                <!-- Encode Tab -->
                <div class="tab-panel active" id="tab-encode">
                    <div class="input-group">
                        <label for="encode-input">输入原始文本</label>
                        <textarea id="encode-input" placeholder="输入需要编码的文本或 URL..."></textarea>
                        <div class="char-count" id="encode-count">字符数: 0</div>
                    </div>

                    <div class="actions-row">
                        <button class="btn" onclick="doEncode()">编码</button>
                        <button class="btn btn-outline" onclick="clearAll('encode')">清空</button>
                        <div class="mode-toggle">
                            <button class="active" data-mode="component"
                                onclick="switchEncodeMode(this, 'component')">encodeURIComponent</button>
                            <button data-mode="uri" onclick="switchEncodeMode(this, 'uri')">encodeURI</button>
                        </div>
                    </div>

                    <div class="input-group" style="margin-top:20px;">
                        <label for="encode-output">编码结果</label>
                        <textarea id="encode-output" readonly placeholder="编码结果将显示在这里..."></textarea>
                        <div class="char-count" id="encode-out-count">字符数: 0</div>
                    </div>

                    <div class="actions-row">
                        <button class="btn btn-copy" onclick="copyResult('encode-output')">复制结果</button>
                    </div>
                </div>

                <!-- Decode Tab -->
                <div class="tab-panel" id="tab-decode">
                    <div class="input-group">
                        <label for="decode-input">输入编码文本</label>
                        <textarea id="decode-input" placeholder="输入需要解码的 URL 编码文本..."></textarea>
                        <div class="char-count" id="decode-count">字符数: 0</div>
                    </div>

                    <div class="actions-row">
                        <button class="btn" onclick="doDecode()">解码</button>
                        <button class="btn btn-outline" onclick="clearAll('decode')">清空</button>
                    </div>

                    <div class="input-group" style="margin-top:20px;">
                        <label for="decode-output">解码结果</label>
                        <textarea id="decode-output" readonly placeholder="解码结果将显示在这里..."></textarea>
                        <div class="char-count" id="decode-out-count">字符数: 0</div>
                    </div>

                    <div class="actions-row">
                        <button class="btn btn-copy" onclick="copyResult('decode-output')">复制结果</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer component container -->
        <div id="footer-container"></div>
    </main>

    <script src="../common/js/utils.js"></script>
    <script>
        var encodeMode = 'component';

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(function (b) {
                if ((tab === 'encode' && b.textContent.indexOf('编码') !== -1 && b.textContent.indexOf('解码') === -1) ||
                    (tab === 'decode' && b.textContent.indexOf('解码') !== -1)) {
                    b.classList.add('active');
                }
            });
        }

        function switchEncodeMode(btn, mode) {
            encodeMode = mode;
            btn.parentElement.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            // Re-encode if output already exists
            if (document.getElementById('encode-output').value) doEncode();
        }

        function doEncode() {
            var input = document.getElementById('encode-input').value;
            var output = document.getElementById('encode-output');
            if (!input) {
                output.value = '';
                document.getElementById('encode-out-count').textContent = '字符数: 0';
                return;
            }
            try {
                if (encodeMode === 'component') {
                    output.value = encodeURIComponent(input);
                } else {
                    output.value = encodeURI(input);
                }
                document.getElementById('encode-out-count').textContent = '字符数: ' + output.value.length;
            } catch (e) {
                utils.showError('编码失败: ' + e.message);
            }
        }

        function doDecode() {
            var input = document.getElementById('decode-input').value;
            var output = document.getElementById('decode-output');
            if (!input) {
                output.value = '';
                document.getElementById('decode-out-count').textContent = '字符数: 0';
                return;
            }
            try {
                output.value = decodeURIComponent(input);
                document.getElementById('decode-out-count').textContent = '字符数: ' + output.value.length;
            } catch (e) {
                // Try decodeURI as fallback
                try {
                    output.value = decodeURI(input);
                    document.getElementById('decode-out-count').textContent = '字符数: ' + output.value.length;
                } catch (e2) {
                    utils.showError('解码失败，请检查输入是否为有效的 URL 编码文本');
                }
            }
        }

        function copyResult(textareaId) {
            var textarea = document.getElementById(textareaId);
            var val = textarea.value;
            if (!val) { utils.showError('没有可复制的内容'); return; }
            navigator.clipboard.writeText(val).then(function () {
                utils.showSuccess('已复制到剪贴板！');
            }).catch(function () { utils.showError('复制失败，请手动复制'); });
        }

        function clearAll(tab) {
            var prefix = tab === 'encode' ? 'encode' : 'decode';
            document.getElementById(prefix + '-input').value = '';
            document.getElementById(prefix + '-output').value = '';
            document.getElementById(prefix + '-count').textContent = '字符数: 0';
            document.getElementById(prefix + '-out-count').textContent = '字符数: 0';
        }

        // Real-time encode/decode
        document.getElementById('encode-input').addEventListener('input', function () {
            document.getElementById('encode-count').textContent = '字符数: ' + this.value.length;
            if (this.value) doEncode(); else {
                document.getElementById('encode-output').value = '';
                document.getElementById('encode-out-count').textContent = '字符数: 0';
            }
        });

        document.getElementById('decode-input').addEventListener('input', function () {
            document.getElementById('decode-count').textContent = '字符数: ' + this.value.length;
            if (this.value) doDecode(); else {
                document.getElementById('decode-output').value = '';
                document.getElementById('decode-out-count').textContent = '字符数: 0';
            }
        });
    </script>
    <script src="../common/js/nav.js"></script>
</body>

</html>
