    <script>
        // ===== LCS Diff Algorithm =====
        function computeLCS(a, b) {
            var m = a.length, n = b.length;
            var dp = new Array(m + 1);
            for (var i = 0; i <= m; i++) {
                dp[i] = new Array(n + 1);
                dp[i][0] = 0;
            }
            for (var j = 0; j <= n; j++) dp[0][j] = 0;

            for (var i = 1; i <= m; i++) {
                for (var j = 1; j <= n; j++) {
                    if (a[i - 1] === b[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // Backtrack
            var result = [];
            var i = m, j = n;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
                    result.unshift({ type: 'same', oldIdx: i - 1, newIdx: j - 1, line: a[i - 1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    result.unshift({ type: 'add', oldIdx: -1, newIdx: j - 1, line: b[j - 1] });
                    j--;
                } else {
                    result.unshift({ type: 'del', oldIdx: i - 1, newIdx: -1, line: a[i - 1] });
                    i--;
                }
            }
            return result;
        }

        function wordDiff(oldText, newText) {
            var oldWords = oldText.split(/(\s+)/);
            var newWords = newText.split(/(\s+)/);
            var diff = computeLCS(oldWords, newWords);

            var oldHtml = '', newHtml = '';
            diff.forEach(function (d) {
                if (d.type === 'same') {
                    oldHtml += escHtml(d.line);
                    newHtml += escHtml(d.line);
                } else if (d.type === 'del') {
                    oldHtml += '<span style="background:#fecaca;text-decoration:line-through;">' + escHtml(d.line) + '</span>';
                } else if (d.type === 'add') {
                    newHtml += '<span style="background:#bbf7d0;">' + escHtml(d.line) + '</span>';
                }
            });
            return { old: oldHtml, new: newHtml };
        }

        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ===== Main diff =====
        function doDiff() {
            var oldText = document.getElementById('input-old').value;
            var newText = document.getElementById('input-new').value;
            var container = document.getElementById('diff-container');
            var statsBar = document.getElementById('stats-bar');

            if (!oldText && !newText) {
                container.innerHTML = '<div class="placeholder"><div class="icon">📋</div><p>请输入文本后点击"开始对比"</p></div>';
                statsBar.style.display = 'none';
                return;
            }

            // Split into lines preserving trailing empty
            var oldLines = oldText.split('\n');
            var newLines = newText.split('\n');

            // Remove last empty line if text doesn't end with newline
            // (split always creates an extra empty element when text ends with \n)
            // We'll handle this carefully

            var showContext = document.getElementById('opt-context').checked;
            var doWordDiff = document.getElementById('opt-word-diff').checked;

            var diff = computeLCS(oldLines, newLines);

            // Count stats
            var added = 0, removed = 0, same = 0;
            diff.forEach(function (d) {
                if (d.type === 'add') added++;
                else if (d.type === 'del') removed++;
                else same++;
            });

            statsBar.style.display = 'flex';
            statsBar.innerHTML =
                '<span class="stat"><span class="dot add"></span> 新增 <strong>' + added + '</strong> 行</span>' +
                '<span class="stat"><span class="dot del"></span> 删除 <strong>' + removed + '</strong> 行</span>' +
                '<span class="stat"><span class="dot mod"></span> 相同 <strong>' + same + '</strong> 行</span>' +
                '<span style="margin-left:auto;color:#94a3b8;">共 ' + diff.length + ' 行</span>';

            // Build HTML table
            var html = '<table class="diff-table"><tbody>';
            var oldLineNum = 0, newLineNum = 0;

            diff.forEach(function (d) {
                if (d.type === 'del') {
                    oldLineNum++;
                    html += '<tr class="diff-line-del">' +
                        '<td class="ln ln-old">' + oldLineNum + '</td>' +
                        '<td class="ln"></td>' +
                        '<td class="content-cell">' + escHtml(d.line) + '</td>' +
                        '</tr>';
                } else if (d.type === 'add') {
                    newLineNum++;
                    html += '<tr class="diff-line-add">' +
                        '<td class="ln"></td>' +
                        '<td class="ln ln-new">' + newLineNum + '</td>' +
                        '<td class="content-cell">' + escHtml(d.line) + '</td>' +
                        '</tr>';
                } else {
                    oldLineNum++; newLineNum++;
                    if (!showContext) {
                        // In collapsed mode, only show context around changes
                        // For now, always show same lines when context is checked
                    }
                    html += '<tr>' +
                        '<td class="ln">' + oldLineNum + '</td>' +
                        '<td class="ln">' + newLineNum + '</td>' +
                        '<td class="content-cell">' + escHtml(d.line) + '</td>' +
                        '</tr>';
                }
            });

            html += '</tbody></table>';

            // Word diff post-processing (simple approach for changed adjacent lines)
            if (doWordDiff) {
                // Find consecutive del+add pairs and highlight word differences
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                var rows = tempDiv.querySelectorAll('tr');
                for (var i = 0; i < rows.length - 1; i++) {
                    if (rows[i].classList.contains('diff-line-del') && rows[i + 1].classList.contains('diff-line-add')) {
                        var oldCell = rows[i].querySelector('.content-cell');
                        var newCell = rows[i + 1].querySelector('.content-cell');
                        if (oldCell && newCell) {
                            var oldTxt = oldCell.textContent;
                            // strip the '- ' prefix visually
                            var newTxt = newCell.textContent;
                            var wd = wordDiff(oldTxt, newTxt);
                            oldCell.innerHTML = wd.old;
                            newCell.innerHTML = wd.new;
                            rows[i].classList.add('diff-line-mod');
                            rows[i + 1].classList.add('diff-line-mod');
                        }
                    }
                }
                html = tempDiv.innerHTML;
            }

            container.innerHTML = html;
        }

        // ===== File handling =====
        function loadFile(side) {
            document.getElementById('file-' + side).click();
        }

        // Common binary file signatures to reject
        var BINARY_SIGS = [
            [0xFF, 0xD8, 0xFF],       // JPEG
            [0x89, 0x50, 0x4E, 0x47], // PNG
            [0x47, 0x49, 0x46, 0x38], // GIF
            [0x42, 0x4D],             // BMP
            [0x50, 0x4B, 0x03, 0x04], // ZIP/DOCX/XLSX
            [0x25, 0x50, 0x44, 0x46], // PDF
            [0xD0, 0xCF, 0x11, 0xE0], // MS Office (old)
            [0x00, 0x00, 0x00],       // MP4/MOV (ftyp box often starts here)
            [0x1F, 0x8B],             // GZIP
            [0x52, 0x61, 0x72, 0x21], // RAR
            [0x7F, 0x45, 0x4C, 0x46], // ELF
        ];

        function isBinaryFile(file) {
            // Check extension first
            var name = file.name.toLowerCase();
            var textExts = ['.txt', '.csv', '.json', '.xml', '.html', '.htm', '.css', '.js', '.ts', '.md',
                '.log', '.yml', '.yaml', '.sql', '.py', '.java', '.c', '.cpp', '.h', '.sh', '.bat',
                '.ini', '.cfg', '.config', '.properties', '.svg', '.vue', '.jsx', '.tsx', '.php',
                '.rb', '.go', '.rs', '.swift', '.kt', '.scala', '.lua', '.r', '.pl', '.pm', '.toml'];
            for (var i = 0; i < textExts.length; i++) {
                if (name.endsWith(textExts[i])) return false;
            }
            // Unknown extension — check magic bytes
            return true;
            // Note: we can't check magic bytes here without reading the file first.
            // We'll do it during read.
        }

        function handleFile(input, side) {
            var file = input.files[0];
            if (!file) return;

            if (isBinaryFile(file)) {
                utils.showError('不支持此文件类型。请上传文本文件（.txt, .json, .csv, .html 等）');
                input.value = '';
                return;
            }

            var reader = new FileReader();
            reader.onload = function (e) {
                // Check for null bytes in first 4KB (binary indicator)
                var text = e.target.result;
                if (text.indexOf('\x00') !== -1) {
                    utils.showError('检测到二进制内容，仅支持纯文本文件对比');
                    input.value = '';
                    return;
                }
                document.getElementById('input-' + side).value = text;
                input.value = '';
                doDiff();
            };
            reader.onerror = function () {
                utils.showError('文件读取失败');
                input.value = '';
            };
            reader.readAsText(file);
        }

        // ===== Swap =====
        function swapInputs() {
            var oldInput = document.getElementById('input-old');
            var newInput = document.getElementById('input-new');
            var tmp = oldInput.value;
            oldInput.value = newInput.value;
            newInput.value = tmp;
            doDiff();
        }

        function clearAll() {
            document.getElementById('input-old').value = '';
            document.getElementById('input-new').value = '';
            document.getElementById('diff-container').innerHTML = '<div class="placeholder"><div class="icon">📋</div><p>在上方输入或粘贴两段文本，点击"开始对比"查看差异</p></div>';
            document.getElementById('stats-bar').style.display = 'none';
        }

        // Real-time with debounce
        var diffTimer = null;
        ['input-old', 'input-new'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                clearTimeout(diffTimer);
                diffTimer = setTimeout(doDiff, 500);
            });
        });
    </script>
    <script src="../common/js/theme.js"></script>
    <script src="../common/js/nav.js"></script>
</body>
