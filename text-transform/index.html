<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="在线大小写批量转换工具，支持文本转大写、转小写、首字母大写、空格清理、多格式输出，免费在线文本格式化工具">
    <meta name="keywords" content="大小写转换，转大写，转小写，首字母大写，空格清理，文本格式化，免费工具">
    <meta name="author" content="余一叶知秋尽">
    <link rel="icon" href="../common/img/helpoke.webp" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index,follow,noai">
    <title>大小写批量转换 - Helpoke 助点站</title>
    <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2048978820706528" crossorigin="anonymous"></script>
    <style>
        @import '../common/css/style.css';
        @import '../common/css/utils.css';
    </style>
    <style>
        .container {
            max-width: 100%;
            padding: 40px 0;
        }

        .tool-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 32px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Consolas', monospace;
            resize: vertical;
            transition: border-color 0.3s;
            min-height: 140px;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .actions-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 8px 15px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-success {
            background-color: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background-color: #229954;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn-warning {
            background-color: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background-color: #e67e22;
        }

        .btn-info {
            background-color: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background-color: #138496;
        }

        .output-section {
            margin-top: 24px;
        }

        .output-group {
            margin-bottom: 20px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .output-label {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }

        .copy-btn {
            padding: 4px 12px;
            font-size: 13px;
            border: 1px solid #3498db;
            background-color: white;
            color: #3498db;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: #3498db;
            color: white;
        }

        .copy-btn.copied {
            background-color: #27ae60;
            border-color: #27ae60;
            color: white;
        }

        .output-text {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Consolas', monospace;
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
            background-color: #f8f9fa;
            box-sizing: border-box;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .tool-card {
                padding: 20px;
                margin: 0 10px;
            }

            .actions-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1>大小写批量转换 & 空格清理</h1>
            <p>在线文本格式化工具，支持多种转换模式，轻松处理大小写和空格问题</p>
        </section>

        <div class="container">
            <div class="tool-card">
                <div class="input-group">
                    <label for="input-text">输入文本</label>
                    <textarea id="input-text" placeholder="请在这里输入或粘贴文本..."></textarea>
                </div>

                <div class="stats" id="stats-panel">
                    <div class="stat-item">字符数: <span class="stat-value" id="char-count">0</span></div>
                    <div class="stat-item">单词数: <span class="stat-value" id="word-count">0</span></div>
                    <div class="stat-item">行数: <span class="stat-value" id="line-count">0</span></div>
                </div>

                <div class="actions-row">
                    <button class="btn btn-primary" id="btn-uppercase">转大写</button>
                    <button class="btn btn-primary" id="btn-lowercase">转小写</button>
                    <button class="btn btn-primary" id="btn-capitalize">首字母大写</button>
                    <button class="btn btn-success" id="btn-title">标题格式</button>
                    <button class="btn btn-info" id="btn-camel">驼峰命名</button>
                    <button class="btn btn-info" id="btn-snake">下划线命名</button>
                    <button class="btn btn-info" id="btn-kebab">短横线命名</button>
                    <button class="btn btn-warning" id="btn-trim">清理空格</button>
                    <button class="btn btn-warning" id="btn-remove-spaces">删除所有空格</button>
                    <button class="btn btn-secondary" id="btn-clear">清空</button>
                </div>

                <div class="output-section">
                    <div class="output-group">
                        <div class="output-header">
                            <label class="output-label">转换结果</label>
                            <button class="copy-btn" id="copy-btn">复制</button>
                        </div>
                        <textarea class="output-text" id="output-text" readonly placeholder="转换后的结果将显示在这里..."></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div id="footer-container"></div>
    </main>

    <script src="../common/js/nav.js"></script>
    <script src="script.js"></script>
</body>

</html>
