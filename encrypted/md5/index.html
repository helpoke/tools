    <script>
        function computeMD5(text) {
            return CryptoJS.MD5(text).toString();
        }

        function get16Bit(hash32) {
            return hash32.substring(8, 24);
        }

        function formatHash(hash, bits, casing) {
            var result = bits === '16' ? get16Bit(hash) : hash;
            return casing === 'upper' ? result.toUpperCase() : result.toLowerCase();
        }

        // ===== Tab switching =====
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // ===== MD5 生成 =====
        function generateMD5() {
            var input = document.getElementById('gen-input').value;
            var resultEl = document.getElementById('gen-result');
            var copyBtn = resultEl.querySelector('.copy-icon-btn');
            var textSpan = resultEl.querySelector('.result-text');

            if (!input.trim()) {
                textSpan.textContent = '请输入文本';
                textSpan.className = 'result-text result-placeholder';
                copyBtn.style.display = 'none';
                return;
            }

            var bits = document.querySelector('input[name="gen-bits"]:checked').value;
            var casing = document.querySelector('input[name="gen-case"]:checked').value;
            var hash = computeMD5(input);
            var result = formatHash(hash, bits, casing);

            textSpan.textContent = result;
            textSpan.className = 'result-text';
            copyBtn.style.display = 'flex';
        }

        function clearGenerate() {
            document.getElementById('gen-input').value = '';
            var resultEl = document.getElementById('gen-result');
            var textSpan = resultEl.querySelector('.result-text');
            textSpan.textContent = '等待生成...';
            textSpan.className = 'result-text result-placeholder';
            resultEl.querySelector('.copy-icon-btn').style.display = 'none';
        }

        // ===== MD5 校验 =====
        function verifyMD5() {
            var input = document.getElementById('verify-input').value;
            var expectedHash = document.getElementById('verify-hash').value.trim();
            var resultEl = document.getElementById('verify-result');

            if (!input.trim()) {
                utils.showError('请输入原始文本');
                return;
            }

            if (!expectedHash) {
                utils.showError('请输入待校验的 MD5 哈希值');
                return;
            }

            var actualHash32 = computeMD5(input);
            var actualHash16 = get16Bit(actualHash32);

            var normalizedExpected = expectedHash.toLowerCase();
            var match = (actualHash32.toLowerCase() === normalizedExpected) ||
                (actualHash16.toLowerCase() === normalizedExpected);

            resultEl.style.display = 'flex';
            if (match) {
                resultEl.className = 'verify-result match';
                resultEl.innerHTML = 'MD5 校验通过 — 文本与哈希值匹配';
            } else {
                resultEl.className = 'verify-result mismatch';
                var actualDisplay = actualHash32.toLowerCase() === normalizedExpected ? actualHash32.toLowerCase() : actualHash32.toLowerCase();
                resultEl.innerHTML = 'MD5 校验不匹配<br><small>实际 32位 MD5：' + actualHash32.toLowerCase() + '</small><br><small>实际 16位 MD5：' + actualHash16.toLowerCase() + '</small>';
            }
        }

        function clearVerify() {
            document.getElementById('verify-input').value = '';
            document.getElementById('verify-hash').value = '';
            var resultEl = document.getElementById('verify-result');
            resultEl.style.display = 'none';
            resultEl.innerHTML = '';
        }

        // ===== 批量生成 =====
        function batchMD5() {
            var input = document.getElementById('batch-input').value;
            var tbody = document.getElementById('batch-tbody');
            var resultSection = document.getElementById('batch-result-section');
            var copyBtn = document.getElementById('batch-copy-btn');

            if (!input.trim()) {
                utils.showError('请输入文本');
                return;
            }

            var lines = input.split('\n');
            var bits = document.querySelector('input[name="batch-bits"]:checked').value;
            var casing = document.querySelector('input[name="batch-case"]:checked').value;

            var rows = '';
            for (var i = 0; i < lines.length; i++) {
                var text = lines[i];
                var hash = computeMD5(text);
                var result = formatHash(hash, bits, casing);
                rows += '<tr>' +
                    '<td class="line-num">' + (i + 1) + '</td>' +
                    '<td>' + escapeHtml(text || '&nbsp;') + '</td>' +
                    '<td><div class="hash-cell"><span>' + result + '</span><button class="copy-icon-btn" onclick="copySingleHash(this)" title="复制">📋</button></div></td>' +
                    '</tr>';
            }

            tbody.innerHTML = rows;
            resultSection.style.display = 'block';
            copyBtn.style.display = 'inline-block';
        }

        function clearBatch() {
            document.getElementById('batch-input').value = '';
            document.getElementById('batch-tbody').innerHTML = '';
            document.getElementById('batch-result-section').style.display = 'none';
            document.getElementById('batch-copy-btn').style.display = 'none';
        }

        function copyBatchResult() {
            var tbody = document.getElementById('batch-tbody');
            var rows = tbody.querySelectorAll('tr');
            var text = '';
            rows.forEach(function (row) {
                var hashSpan = row.querySelector('.hash-cell span');
                if (hashSpan) {
                    text += hashSpan.textContent + '\n';
                }
            });

            if (!text) {
                utils.showError('请先生成批量结果');
                return;
            }

            navigator.clipboard.writeText(text.trim()).then(function () {
                utils.showSuccess('已复制全部 MD5 结果');
            }).catch(function () {
                utils.showError('复制失败，请手动复制');
            });
        }

        // ===== 通用复制 =====
        function copyResult(resultId) {
            var resultEl = document.getElementById(resultId);
            var textSpan = resultEl.querySelector('.result-text');
            var text = textSpan.textContent;

            if (!text || textSpan.classList.contains('result-placeholder')) return;

            navigator.clipboard.writeText(text).then(function () {
                var copyBtn = resultEl.querySelector('.copy-icon-btn');
                copyBtn.classList.add('copied');
                copyBtn.textContent = '✓';
                setTimeout(function () {
                    copyBtn.classList.remove('copied');
                    copyBtn.textContent = '📋';
                }, 1500);
                utils.showSuccess('已复制');
            }).catch(function () {
                utils.showError('复制失败');
            });
        }

        function copySingleHash(btn) {
            var hash = btn.parentElement.querySelector('span').textContent;
            navigator.clipboard.writeText(hash).then(function () {
                btn.classList.add('copied');
                btn.textContent = '✓';
                setTimeout(function () {
                    btn.classList.remove('copied');
                    btn.textContent = '📋';
                }, 1500);
                utils.showSuccess('已复制');
            }).catch(function () {
                utils.showError('复制失败');
            });
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    
</body>

</html>
