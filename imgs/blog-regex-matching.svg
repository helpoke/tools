<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Regular Expression: Pattern Matching Engine</text>
  <!-- Input text -->
  <g transform="translate(40,55)">
    <text x="0" y="0" font-size="13" fill="#64748b" font-weight="600">Input Text:</text>
    <rect x="0" y="8" width="720" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="15" y="34" font-size="13" fill="#334155" font-family="monospace">Contact us at </text>
    <rect x="138" y="14" width="170" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="143" y="33" font-size="13" fill="#92400e" font-family="monospace">admin@example.com</text>
    <text x="312" y="34" font-size="13" fill="#334155" font-family="monospace"> or call </text>
    <rect x="385" y="14" width="120" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="390" y="33" font-size="13" fill="#065f46" font-family="monospace">138-0013-8000</text>
    <text x="510" y="34" font-size="13" fill="#334155" font-family="monospace"> or visit </text>
    <rect x="575" y="14" width="155" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="580" y="33" font-size="13" fill="#1e40af" font-family="monospace">https://helpoke.com</text>
  </g>
  <!-- Patterns -->
  <g transform="translate(40,120)">
    <text x="0" y="0" font-size="13" fill="#64748b" font-weight="600">Regex Patterns:</text>
    <!-- Email -->
    <rect x="0" y="10" width="230" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="10" y="32" font-size="12" fill="#92400e" font-weight="700">📧 Email</text>
    <text x="10" y="50" font-size="11" fill="#78350f" font-family="monospace">[\w.]+@[\w]+\.[\w.]+</text>
    <!-- Phone -->
    <rect x="245" y="10" width="230" height="50" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="255" y="32" font-size="12" fill="#065f46" font-weight="700">📱 Phone (China)</text>
    <text x="255" y="50" font-size="11" fill="#064e3b" font-family="monospace">1[3-9]\d{9}</text>
    <!-- URL -->
    <rect x="490" y="10" width="230" height="50" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="500" y="32" font-size="12" fill="#1e3a8a" font-weight="700">🔗 URL</text>
    <text x="500" y="50" font-size="11" fill="#1e40af" font-family="monospace">https?://[\w./\-]+</text>
  </g>
  <!-- Syntax reference -->
  <g transform="translate(40,195)">
    <text x="0" y="0" font-size="13" fill="#64748b" font-weight="600">Essential Syntax:</text>
    <rect x="0" y="10" width="720" height="145" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <g font-size="12" fill="#334155">
      <text x="20" y="34" font-weight="700" fill="#6366f1">Quantifiers</text>
      <text x="20" y="52" font-family="monospace">*  = 0 or more</text>
      <text x="20" y="68" font-family="monospace">+  = 1 or more</text>
      <text x="20" y="84" font-family="monospace">?  = 0 or 1</text>
      <text x="20" y="100" font-family="monospace">{n} = exactly n</text>
      <text x="20" y="116" font-family="monospace">{n,m} = n to m</text>
      <text x="200" y="34" font-weight="700" fill="#6366f1">Character Classes</text>
      <text x="200" y="52" font-family="monospace">\d = [0-9] digit</text>
      <text x="200" y="68" font-family="monospace">\w = [a-zA-Z0-9_]</text>
      <text x="200" y="84" font-family="monospace">\s = space/tab/newline</text>
      <text x="200" y="100" font-family="monospace">.  = any char (except \n)</text>
      <text x="200" y="116" font-family="monospace">[^ ] = negated class</text>
      <text x="420" y="34" font-weight="700" fill="#6366f1">Anchors &amp; Groups</text>
      <text x="420" y="52" font-family="monospace">^  = start of string</text>
      <text x="420" y="68" font-family="monospace">$  = end of string</text>
      <text x="420" y="84" font-family="monospace">( ) = capture group</text>
      <text x="420" y="100" font-family="monospace">(?: ) = non-capture</text>
      <text x="420" y="116" font-family="monospace">|  = alternation (OR)</text>
    </g>
  </g>
</svg>