<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="800" height="380" fill="url(#bg)" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">RSA Asymmetric Encryption: Public Key &amp; Private Key</text>
  <!-- Alice side -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="340" height="260" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="170" y="24" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">🔑 Key Generation</text>
    <!-- Step 1 -->
    <rect x="15" y="38" width="310" height="36" rx="6" fill="#eff6ff"/>
    <text x="170" y="60" text-anchor="middle" font-size="12" fill="#1e40af">1. Choose two large primes: p, q</text>
    <!-- Step 2 -->
    <rect x="15" y="80" width="310" height="36" rx="6" fill="#eff6ff"/>
    <text x="170" y="102" text-anchor="middle" font-size="12" fill="#1e40af">2. Compute n = p × q, φ(n) = (p-1)(q-1)</text>
    <!-- Step 3 -->
    <rect x="15" y="122" width="310" height="36" rx="6" fill="#eff6ff"/>
    <text x="170" y="144" text-anchor="middle" font-size="12" fill="#1e40af">3. Choose e (public), compute d (private)</text>
    <!-- Keys -->
    <rect x="15" y="170" width="148" height="76" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="89" y="192" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">🔓 Public Key</text>
    <text x="89" y="210" text-anchor="middle" font-size="11" fill="#064e3b">(n, e)</text>
    <text x="89" y="228" text-anchor="middle" font-size="10" fill="#065f46">Share with everyone</text>
    <rect x="177" y="170" width="148" height="76" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="251" y="192" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">🔐 Private Key</text>
    <text x="251" y="210" text-anchor="middle" font-size="11" fill="#7f1d1d">(n, d)</text>
    <text x="251" y="228" text-anchor="middle" font-size="10" fill="#991b1b">Keep secret!</text>
  </g>
  <!-- Bob side -->
  <g transform="translate(420,60)">
    <rect x="0" y="0" width="350" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="175" y="24" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">📤 Encryption (Bob)</text>
    <rect x="15" y="38" width="320" height="68" rx="8" fill="#faf5ff"/>
    <text x="175" y="60" text-anchor="middle" font-size="12" fill="#5b21b6">Plaintext M → C = Mᵉ mod n</text>
    <text x="175" y="80" text-anchor="middle" font-size="11" fill="#64748b">Uses Alice's Public Key (n, e)</text>
    <text x="175" y="98" text-anchor="middle" font-size="11" fill="#64748b">Anyone can encrypt, but cannot decrypt</text>
  </g>
  <!-- Alice decrypt -->
  <g transform="translate(420,200)">
    <rect x="0" y="0" width="350" height="120" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="175" y="24" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">📥 Decryption (Alice)</text>
    <rect x="15" y="38" width="320" height="68" rx="8" fill="#fef2f2"/>
    <text x="175" y="60" text-anchor="middle" font-size="12" fill="#991b1b">Ciphertext C → M = Cᵈ mod n</text>
    <text x="175" y="80" text-anchor="middle" font-size="11" fill="#64748b">Uses Alice's Private Key (n, d)</text>
    <text x="175" y="98" text-anchor="middle" font-size="11" fill="#64748b">Only Alice can decrypt the message</text>
  </g>
  <!-- Arrows -->
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M370,130 L420,130" marker-end="url(#a)"/>
    <path d="M420,260 L370,260" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94a3b8"/></marker></defs>
  <!-- Bottom note -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="680" height="30" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="340" y="20" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">Key sizes: RSA-2048 (standard) | RSA-4096 (high security) | Never use below RSA-1024</text>
  </g>
</svg>