<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Hash Algorithm Comparison: Input → Fixed-Length Output</text>
  <!-- Input -->
  <g transform="translate(30,70)">
    <rect x="0" y="0" width="140" height="60" rx="10" fill="#6366f1"/>
    <text x="70" y="24" text-anchor="middle" font-size="13" fill="#e0e7ff" font-weight="600">Input Data</text>
    <text x="70" y="44" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">"Hello World"</text>
  </g>
  <!-- Arrows to each hash -->
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M170,85 C200,85 200,105 230,105" marker-end="url(#a)"/>
    <path d="M170,95 C200,95 200,175 230,175" marker-end="url(#a)"/>
    <path d="M170,105 C200,105 200,245 230,245" marker-end="url(#a)"/>
    <path d="M170,115 C200,115 200,315 230,315" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94a3b8"/></marker></defs>
  <!-- MD5 -->
  <g transform="translate(230,80)">
    <rect x="0" y="0" width="540" height="50" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="10" y="20" font-size="13" fill="#991b1b" font-weight="700">MD5 (128-bit / 32 chars)</text>
    <text x="10" y="40" font-size="12" fill="#7f1d1d" font-family="monospace">5eb63bbbe01eeed093cb22bb8f5acdc3</text>
    <rect x="460" y="8" width="70" height="34" rx="6" fill="#ef4444"/>
    <text x="495" y="30" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">⚠ 已不安全</text>
  </g>
  <!-- SHA-1 -->
  <g transform="translate(230,150)">
    <rect x="0" y="0" width="540" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="10" y="20" font-size="13" fill="#92400e" font-weight="700">SHA-1 (160-bit / 40 chars)</text>
    <text x="10" y="40" font-size="12" fill="#78350f" font-family="monospace">0a4d55a8d778e5022fab701977c5d840bbc486d0</text>
    <rect x="460" y="8" width="70" height="34" rx="6" fill="#f59e0b"/>
    <text x="495" y="30" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">⚠ 不推荐</text>
  </g>
  <!-- SHA-256 -->
  <g transform="translate(230,220)">
    <rect x="0" y="0" width="540" height="50" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="10" y="20" font-size="13" fill="#065f46" font-weight="700">SHA-256 (256-bit / 64 chars)</text>
    <text x="10" y="40" font-size="12" fill="#064e3b" font-family="monospace">a591a6d40bf420404a011733cfb7b190d62c65bf0bcda32b57b277d9ad9f146e</text>
    <rect x="460" y="8" width="70" height="34" rx="6" fill="#10b981"/>
    <text x="495" y="30" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">✓ 推荐</text>
  </g>
  <!-- SHA-512 -->
  <g transform="translate(230,290)">
    <rect x="0" y="0" width="540" height="50" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="10" y="20" font-size="13" fill="#1e3a8a" font-weight="700">SHA-512 (512-bit / 128 chars)</text>
    <text x="10" y="40" font-size="11" fill="#1e3a8a" font-family="monospace">988a89fb49cf3... (128 characters total)</text>
    <rect x="460" y="8" width="70" height="34" rx="6" fill="#3b82f6"/>
    <text x="495" y="30" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">✓ 高安全</text>
  </g>
  <!-- Properties -->
  <g transform="translate(60,365)">
    <rect x="0" y="0" width="680" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="340" y="18" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">Core Properties of Hash Functions</text>
    <text x="340" y="36" text-anchor="middle" font-size="11" fill="#64748b">Deterministic | Fast computation | One-way (preimage resistance) | Avalanche effect | Collision resistant</text>
  </g>
</svg>