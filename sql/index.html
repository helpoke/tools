    <script>
        (function () {
            const SQL_KEYWORDS = [
                'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'NOT', 'IN', 'LIKE', 'BETWEEN',
                'JOIN', 'INNER', 'LEFT', 'RIGHT', 'OUTER', 'FULL', 'CROSS', 'ON',
                'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE',
                'CREATE', 'ALTER', 'DROP', 'TABLE', 'INDEX', 'VIEW', 'DATABASE', 'SCHEMA',
                'SELECT', 'DISTINCT', 'AS', 'ORDER', 'BY', 'ASC', 'DESC', 'GROUP', 'HAVING',
                'LIMIT', 'OFFSET', 'TOP', 'UNION', 'ALL', 'EXCEPT', 'INTERSECT',
                'CASE', 'WHEN', 'THEN', 'ELSE', 'END', 'NULL', 'IS', 'EXISTS',
                'PRIMARY', 'KEY', 'FOREIGN', 'REFERENCES', 'CONSTRAINT', 'DEFAULT',
                'AUTO_INCREMENT', 'UNIQUE', 'CHECK', 'CASCADE', 'RESTRICT',
                'INNER', 'OUTER', 'CROSS', 'NATURAL', 'USING', 'HAVING',
                'GRANT', 'REVOKE', 'TRUNCATE', 'REPLACE', 'MERGE',
                'EXPLAIN', 'DESCRIBE', 'SHOW', 'USE', 'BEGIN', 'COMMIT', 'ROLLBACK',
                'TRANSACTION', 'SAVEPOINT', 'LOCK', 'UNLOCK',
                'IF', 'ELSEIF', 'LOOP', 'LEAVE', 'ITERATE', 'WHILE', 'REPEAT', 'UNTIL'
            ];

            const SQL_FUNCTIONS = [
                'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'COALESCE', 'NULLIF',
                'CONCAT', 'LENGTH', 'UPPER', 'LOWER', 'TRIM', 'LTRIM', 'RTRIM',
                'SUBSTRING', 'SUBSTR', 'REPLACE', 'REVERSE', 'LPAD', 'RPAD',
                'CAST', 'CONVERT', 'ROUND', 'FLOOR', 'CEIL', 'ABS', 'MOD',
                'NOW', 'CURDATE', 'CURTIME', 'DATE', 'TIME', 'YEAR', 'MONTH', 'DAY',
                'DATE_ADD', 'DATE_SUB', 'DATEDIFF', 'DATE_FORMAT',
                'IFNULL', 'NVL', 'DECODE', 'TO_CHAR', 'TO_DATE', 'TO_NUMBER',
                'ROW_NUMBER', 'RANK', 'DENSE_RANK', 'LEAD', 'LAG', 'FIRST_VALUE', 'LAST_VALUE',
                'OVER', 'PARTITION', 'ROWS', 'RANGE', 'PRECEDING', 'FOLLOWING', 'UNBOUNDED'
            ];

            const inputSql = document.getElementById('inputSql');
            const outputSql = document.getElementById('outputSql');
            const errorMsg = document.getElementById('errorMsg');
            const lineCount = document.getElementById('lineCount');
            const charCount = document.getElementById('charCount');
            const keywordCount = document.getElementById('keywordCount');

            function tokenize(sql) {
                const tokens = [];
                let i = 0;
                while (i < sql.length) {
                    if (/\s/.test(sql[i])) {
                        let ws = '';
                        while (i < sql.length && /\s/.test(sql[i])) {
                            ws += sql[i];
                            i++;
                        }
                        tokens.push({ type: 'whitespace', value: ws });
                    } else if (sql.substring(i, i + 2) === '--') {
                        let comment = '';
                        while (i < sql.length && sql[i] !== '\n') {
                            comment += sql[i];
                            i++;
                        }
                        tokens.push({ type: 'comment', value: comment });
                    } else if (sql.substring(i, i + 2) === '/*') {
                        let comment = '/*';
                        i += 2;
                        while (i < sql.length - 1 && sql.substring(i, i + 2) !== '*/') {
                            comment += sql[i];
                            i++;
                        }
                        comment += '*/';
                        i += 2;
                        tokens.push({ type: 'comment', value: comment });
                    } else if (sql[i] === "'" || sql[i] === '"') {
                        const quote = sql[i];
                        let str = quote;
                        i++;
                        while (i < sql.length) {
                            if (sql[i] === quote && sql[i - 1] !== '\\') {
                                str += quote;
                                i++;
                                break;
                            }
                            str += sql[i];
                            i++;
                        }
                        tokens.push({ type: 'string', value: str });
                    } else if (/[0-9]/.test(sql[i]) || (sql[i] === '.' && /[0-9]/.test(sql[i + 1]))) {
                        let num = '';
                        while (i < sql.length && /[0-9.]/.test(sql[i])) {
                            num += sql[i];
                            i++;
                        }
                        tokens.push({ type: 'number', value: num });
                    } else if (/[a-zA-Z_]/.test(sql[i])) {
                        let word = '';
                        while (i < sql.length && /[a-zA-Z0-9_]/.test(sql[i])) {
                            word += sql[i];
                            i++;
                        }
                        const upperWord = word.toUpperCase();
                        if (SQL_KEYWORDS.includes(upperWord)) {
                            tokens.push({ type: 'keyword', value: word });
                        } else if (SQL_FUNCTIONS.includes(upperWord)) {
                            tokens.push({ type: 'function', value: word });
                        } else {
                            tokens.push({ type: 'identifier', value: word });
                        }
                    } else if ('(),;*'.includes(sql[i])) {
                        tokens.push({ type: 'punctuation', value: sql[i] });
                        i++;
                    } else if ('+-*/<>=!~^|%'.includes(sql[i])) {
                        let op = sql[i];
                        i++;
                        while (i < sql.length && '+-*/<>=!~^|%'.includes(sql[i])) {
                            op += sql[i];
                            i++;
                        }
                        tokens.push({ type: 'operator', value: op });
                    } else {
                        tokens.push({ type: 'unknown', value: sql[i] });
                        i++;
                    }
                }
                return tokens;
            }

            function formatKeyword(word, uppercase) {
                if (uppercase === 'upper') return word.toUpperCase();
                if (uppercase === 'lower') return word.toLowerCase();
                return word;
            }

            function formatSql(sql, options = {}) {
                const {
                    indent = 4,
                    indentChar = ' ',
                    uppercase = 'preserve',
                    linesBetween = 1,
                    breakBeforeAndOr = true
                } = options;

                const indentStr = indentChar === 'tab' ? '\t' : indentChar.repeat(indent);
                const tokens = tokenize(sql);
                const lines = [];
                let currentLine = '';
                let currentIndent = 0;
                let i = 0;

                const topLevelKeywords = ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'CREATE', 'ALTER', 'DROP', 'GRANT', 'REVOKE', 'EXPLAIN', 'DESCRIBE', 'SHOW', 'USE', 'BEGIN', 'COMMIT', 'ROLLBACK', 'TRUNCATE', 'REPLACE', 'MERGE'];
                const clauseKeywords = ['FROM', 'WHERE', 'AND', 'OR', 'SET', 'VALUES', 'ORDER BY', 'GROUP BY', 'HAVING', 'LIMIT', 'OFFSET', 'ON', 'INTO', 'TABLE', 'INDEX', 'VIEW'];
                const breakKeywords = ['AND', 'OR'];

                for (let j = 0; j < tokens.length; j++) {
                    const token = tokens[j];

                    if (token.type === 'whitespace') {
                        if (token.value.includes('\n')) {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                                currentLine = '';
                            }
                        } else {
                            currentLine += ' ';
                        }
                        continue;
                    }

                    if (token.type === 'comment') {
                        if (currentLine.trim()) {
                            lines.push(currentLine);
                        }
                        lines.push(token.value);
                        currentLine = '';
                        continue;
                    }

                    if (token.type === 'keyword') {
                        const upperToken = token.value.toUpperCase();

                        if (upperToken === 'FROM' || upperToken === 'WHERE' || upperToken === 'SET') {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentIndent = 1;
                            currentLine = indentStr + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'AND' || upperToken === 'OR') {
                            if (breakBeforeAndOr && currentLine.trim() && !currentLine.trim().startsWith('(')) {
                                lines.push(currentLine);
                                currentLine = indentStr + formatKeyword(token.value, uppercase);
                            } else {
                                currentLine += ' ' + formatKeyword(token.value, uppercase);
                            }
                        } else if (upperToken === 'SELECT' && j > 0 && tokens[j - 1].value.toUpperCase() !== ')' && j > 0) {
                            if (currentLine.trim() && !currentLine.trim().startsWith('(')) {
                                lines.push(currentLine);
                            }
                            currentIndent = 1;
                            currentLine = indentStr + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'JOIN' || upperToken === 'INNER' || upperToken === 'LEFT' || upperToken === 'RIGHT' || upperToken === 'FULL' || upperToken === 'CROSS' || upperToken === 'OUTER') {
                            if (currentLine.trim() && !currentLine.trim().startsWith('(')) {
                                lines.push(currentLine);
                            }
                            currentIndent = 1;
                            currentLine = indentStr + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'ORDER' || upperToken === 'GROUP' || upperToken === 'HAVING' || upperToken === 'LIMIT' || upperToken === 'OFFSET') {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentIndent = 0;
                            currentLine = indentStr + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'BY') {
                            currentLine += ' ' + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'AS') {
                            currentLine += ' ' + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'CASE') {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentLine = indentStr + 'CASE';
                            currentIndent++;
                        } else if (upperToken === 'WHEN' || upperToken === 'THEN' || upperToken === 'ELSE') {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentLine = indentStr + formatKeyword(token.value, uppercase);
                        } else if (upperToken === 'END') {
                            if (currentLine.trim()) {
                                lines.push(currentLine);
                            }
                            currentIndent = Math.max(0, currentIndent - 1);
                            currentLine = indentStr + 'END';
                        } else if (upperToken === 'IN' || upperToken === 'NOT') {
                            currentLine += ' ' + formatKeyword(token.value, uppercase);
                        } else {
                            currentLine += ' ' + formatKeyword(token.value, uppercase);
                        }
                    } else if (token.type === 'function') {
                        currentLine += ' ' + token.value.toUpperCase();
                    } else if (token.type === 'string') {
                        currentLine += token.value;
                    } else if (token.type === 'number') {
                        currentLine += token.value;
                    } else if (token.type === 'punctuation') {
                        if (token.value === ',') {
                            currentLine += ',';
                        } else if (token.value === '(') {
                            currentLine += '(';
                            currentIndent++;
                        } else if (token.value === ')') {
                            currentIndent = Math.max(0, currentIndent - 1);
                            currentLine += ')';
                        } else if (token.value === ';') {
                            currentLine += ';';
                            lines.push(currentLine);
                            currentLine = '';
                            currentIndent = 0;
                        } else {
                            currentLine += token.value;
                        }
                    } else if (token.type === 'operator') {
                        currentLine += ' ' + token.value + ' ';
                    } else if (token.type === 'identifier') {
                        currentLine += ' ' + token.value;
                    } else {
                        currentLine += token.value;
                    }
                }

                if (currentLine.trim()) {
                    lines.push(currentLine);
                }

                let result = lines.join('\n');

                if (linesBetween > 0) {
                    for (let k = 0; k < linesBetween; k++) {
                        result = result.replace(/\n\n\n+/g, '\n\n');
                    }
                }

                return result;
            }

            function compressSql(sql) {
                return sql
                    .replace(/\s+/g, ' ')
                    .replace(/\s*,\s*/g, ',')
                    .replace(/\s*\(\s*/g, '(')
                    .replace(/\s*\)\s*/g, ')')
                    .replace(/\s*=\s*/g, '=')
                    .replace(/\s*!=\s*/g, '!=')
                    .replace(/\s*<>\s*/g, '<>')
                    .replace(/\s*>\s*/g, '>')
                    .replace(/\s*<\s*/g, '<')
                    .replace(/\s*>=\s*/g, '>=')
                    .replace(/\s*<=\s*/g, '<=')
                    .replace(/\s*AND\s*/gi, ' AND ')
                    .replace(/\s*OR\s*/gi, ' OR ')
                    .replace(/^\s+|\s+$/g, '')
                    .replace(/;\s*$/g, ';');
            }

            function updateStats(sql) {
                const lines = sql.split('\n').filter(l => l.trim()).length;
                const chars = sql.length;
                const keywords = (sql.match(/\b(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|AND|OR|JOIN|ON|ORDER|GROUP|BY|LIMIT|OFFSET)\b/gi) || []).length;
                lineCount.textContent = '行数: ' + lines;
                charCount.textContent = '字符: ' + chars;
                keywordCount.textContent = '关键词: ' + keywords;
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
            }

            function hideError() {
                errorMsg.classList.remove('show');
            }

            document.getElementById('formatBtn').addEventListener('click', function () {
                const sql = inputSql.value.trim();
                if (!sql) {
                    showError('请输入 SQL 语句');
                    return;
                }
                hideError();

                const indent = parseInt(document.getElementById('indent').value);
                const indentChar = document.getElementById('indent').value === 'tab' ? '\t' : ' ';
                const uppercase = document.getElementById('uppercase').value;
                const linesBetween = parseInt(document.getElementById('linesBetween').value);
                const breakBeforeAndOr = document.getElementById('breakBeforeAnd').checked;

                try {
                    const formatted = formatSql(sql, {
                        indent,
                        indentChar,
                        uppercase,
                        linesBetween,
                        breakBeforeAndOr
                    });
                    outputSql.value = formatted;
                    updateStats(formatted);
                } catch (e) {
                    showError('格式化失败: ' + e.message);
                }
            });

            document.getElementById('compressBtn').addEventListener('click', function () {
                const sql = inputSql.value.trim();
                if (!sql) {
                    showError('请输入 SQL 语句');
                    return;
                }
                hideError();

                try {
                    const formatted = formatSql(sql, {
                        indent: 1,
                        indentChar: ' ',
                        uppercase: 'upper',
                        linesBetween: 0,
                        breakBeforeAndOr: false
                    });
                    const compressed = compressSql(formatted);
                    outputSql.value = compressed;
                    updateStats(compressed);
                } catch (e) {
                    showError('压缩失败: ' + e.message);
                }
            });

            document.getElementById('clearBtn').addEventListener('click', function () {
                inputSql.value = '';
                outputSql.value = '';
                hideError();
                updateStats('');
            });

            document.getElementById('sampleBtn').addEventListener('click', function () {
                inputSql.value = `SELECT u.id,u.username,u.email,o.order_id,o.total_amount,
o.created_at AS order_date FROM users u INNER JOIN orders o ON u.id=o.user_id
WHERE u.status='active' AND o.total_amount>100 ORDER BY o.created_at DESC LIMIT 10;`;
                hideError();
            });

            document.getElementById('copyBtn').addEventListener('click', function () {
                const text = outputSql.value;
                if (!text) {
                    showError('没有内容可复制');
                    return;
                }
                navigator.clipboard.writeText(text).then(function () {
                    const btn = document.getElementById('copyBtn');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '已复制';
                    btn.style.backgroundColor = '#059669';
                    setTimeout(function () {
                        btn.innerHTML = originalText;
                        btn.style.backgroundColor = '';
                    }, 2000);
                }).catch(function () {
                    showError('复制失败，请手动选择复制');
                });
            });

            inputSql.addEventListener('input', function () {
                if (!outputSql.value || outputSql.value === '格式化后的 SQL 将显示在这里...') {
                    updateStats(inputSql.value);
                }
            });
        })();
    </script>
</body>

</html>
