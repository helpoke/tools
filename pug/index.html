<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Pug在线格式化工具, Pug语法校验, Pug代码美化, 免费在线Pug格式化, Pug压缩, Pug错误定位, Jade格式化">
    <meta name="keywords" content="Pug格式化, Pug在线校验, Pug代码美化, Pug在线格式化, Pug压缩, Jade格式化, 免费Pug工具, Pug beautify">
    <meta name="author" content="余一叶知秋尽">
    <link rel="icon" href="../common/img/helpoke.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pug在线格式化校验工具</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/css/style.css">
    <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
    <script type="module">
        import pugBeautify from 'https://esm.sh/@johnsoncodehk/pug-beautify@0.2.2';
        import pugLexer from 'https://esm.sh/pug-lexer@5';
        import pugParser from 'https://esm.sh/pug-parser@6';
        window.pugBeautify = pugBeautify;
        window.pugLexer = pugLexer;
        window.pugParser = pugParser;
    </script>
    <script src="script.js" defer></script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pug格式化工具",
        "description": "Pug/Jade在线格式化工具，支持代码美化、语法校验和错误定位。免费在线Pug开发工具。Online Pug/Jade formatter with syntax validation and code beautification.",
        "url": "https://helpoke.com/pug",
        "applicationCategory": "https://schema.org/DeveloperTool",
        "inLanguage": ["zh-CN", "en-US"], 
        "featureList": [
            "Pug/Jade代码格式化美化",
            "Pug语法校验",
            "错误行定位提示",
            "代码压缩功能",
            "语法高亮显示",
            "支持Jade语法"
        ],
        "operatingSystem": "Web",
        "author": {
            "@type": "Organization",
            "name": "Helpoke",
            "url": "https://helpoke.com"
        },
        "offers": {
            "@type": "Offer",
            "price": 0,
            "priceCurrency": "CNY",
            "availability": "https://schema.org/InStock" 
        }
    }
    </script>
</head>

<body>
    <!-- Navigation component container -->
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1>Pug 格式化校验工具</h1>
            <p>在线 Pug 代码格式化、语法校验、压缩，基于 pug-beautify 美化和 pug 编译器校验，离线工具保护数据安全</p>
        </section>
        <div class="container">
            <div class="tool-header">
                <h2>Pug 编辑器</h2>
                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                    <span id="status-badge" class="success-badge">等待输入</span>
                    <div class="button-group">
                        <button class="btn" onclick="loadSample()">示例数据</button>
                        <button class="btn primary" onclick="formatPug()">格式化</button>
                        <button class="btn" onclick="validatePug()">校验语法</button>
                        <button class="btn" onclick="minifyPug()">压缩</button>
                        <button class="btn" onclick="copyOutput()">复制结果</button>
                        <button class="btn" onclick="clearAll()">清空</button>
                    </div>
                </div>
            </div>

            <div class="editor-panel">
                <div class="panel">
                    <div class="panel-header">输入 Pug</div>
                    <div class="panel-body">
                        <div class="input-with-lines">
                            <div class="line-numbers" id="input-lines"><span>1</span></div>
                            <textarea id="pug-input" placeholder="请在此输入 Pug 内容，或点击「示例数据」查看效果..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header">格式化输出</div>
                    <div class="panel-body">
                        <div class="output-with-lines">
                            <div class="line-numbers" id="output-lines"><span></span></div>
                            <div class="output-content" id="pug-output"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel error-panel" id="error-panel" style="display:none;">
                <div class="panel-header">语法错误 <span id="error-count" style="color:#ef4444;"></span></div>
                <div id="error-list"></div>
            </div>
        </div>


        <!-- Footer component container -->
        <div id="footer-container"></div>
    </main>

    <script src="../common/js/nav.js"></script>
</body>

</html>
