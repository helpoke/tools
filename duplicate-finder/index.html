    <script src="../common/js/utils.js"></script>
    <script>
        function findDuplicates() {
            var input = document.getElementById('input-text');
            var errorBox = document.getElementById('error-box');
            var resultSection = document.getElementById('result-section');

            errorBox.classList.remove('show');
            resultSection.classList.remove('show');

            var text = input.value.trim();
            if (!text) {
                errorBox.textContent = '请输入要检测的文本内容';
                errorBox.classList.add('show');
                return;
            }

            // 使用多种分隔符进行分割（包含中英文标点符号）
            var separators = /[\s,\，;\；\|\、·\n\t。.？?！!：:；;""''""''""''[\]【】()（）{}<>《》「」『』·—–—_=+\-*/\\~`@#$%^&*|§±÷×√π∞∑∈√∠∟⊿∩∪∫∮∴∵∷⊙⊕⊗⊘⊝⊠⊡⋄⋅⋆⋇⋈⋉⋊⋋⋌◈◇◉○◌◎●◐◑◒◓◔◕◖◗◘◙◚◛◜◝◞◟◠◡◢◣◤◥◦◧◨◩◪◫◬◭◮◯⊕⊖⊗⊘⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿]+/;
            var items = text.split(separators).filter(function(item) {
                return item.trim() !== '';
            });

            if (items.length === 0) {
                errorBox.textContent = '未能识别到有效内容，请检查输入格式';
                errorBox.classList.add('show');
                return;
            }

            // 去除标点符号的函数
            function removePunctuation(str) {
                // 去除中英文标点符号
                return str.replace(/[!"#$%&'()*+,-./:;<=>?@[\]^_`{|}~！@#￥%……&*（）——+|{}【】；："'《》？、。，·]/g, '').trim();
            }

            // 统计每个元素出现的次数（使用去除标点符号后的版本）
            var counts = {};
            var originalMap = {}; // 保存原始内容映射

            items.forEach(function(item) {
                var key = removePunctuation(item);
                if (!key) return; // 如果去除标点后为空，跳过

                if (!counts[key]) {
                    counts[key] = 0;
                    originalMap[key] = item; // 保存第一个出现的原始内容
                }
                counts[key]++;
            });

            // 找出重复出现两次以上的内容
            var duplicates = [];
            Object.keys(counts).forEach(function(key) {
                if (counts[key] >= 2) {
                    duplicates.push({
                        value: originalMap[key], // 使用原始内容显示
                        count: counts[key],
                        key: key // 用于高亮匹配
                    });
                }
            });

            // 按重复次数排序
            duplicates.sort(function(a, b) {
                return b.count - a.count;
            });

            // 更新统计信息
            document.getElementById('stat-total').textContent = items.length;
            document.getElementById('stat-unique').textContent = Object.keys(counts).length;
            document.getElementById('stat-duplicates').textContent = duplicates.length;
            document.getElementById('dup-count').textContent = duplicates.length;

            // 显示重复标签
            var tagsHtml = '';
            duplicates.forEach(function(item) {
                tagsHtml += '<span class="duplicate-tag">' +
                    item.value +
                    '<span class="count">' + item.count + '次</span>' +
                    '</span>';
            });
            document.getElementById('duplicate-tags').innerHTML = tagsHtml;

            // 高亮显示原文中的重复内容（匹配去除标点符号后的版本）
            var highlightedText = text;
            duplicates.forEach(function(item) {
                // 创建正则表达式，匹配去除标点符号后的内容
                var regex = new RegExp(escapeRegex(item.key), 'g');
                highlightedText = highlightedText.replace(regex, '<mark>$&</mark>');
            });
            document.getElementById('highlighted-text').innerHTML = highlightedText;

            resultSection.classList.add('show');

            if (duplicates.length === 0) {
                document.getElementById('duplicate-tags').innerHTML = '<span style="color:#7f8c8d;">未找到重复内容</span>';
            }
        }

        function clearAll() {
            document.getElementById('input-text').value = '';
            document.getElementById('error-box').classList.remove('show');
            document.getElementById('result-section').classList.remove('show');
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        document.getElementById('input-text').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                findDuplicates();
            }
        });

        document.getElementById('input-text').addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                document.getElementById('error-box').classList.remove('show');
            }
        });
    </script>
