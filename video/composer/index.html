<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index,follow,noai">
    <title>视频合成工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>视频合成工具</h1>
        
        <div class="input-section">
            <h2>视频文件</h2>
            <div id="video-inputs" class="video-inputs">
                <div class="video-item">
                    <input type="file" class="video-file" accept="video/*,.ts">
                    <button class="play-video">播放</button>
                    <button class="remove-video">移除</button>
                </div>
            </div>
            <button id="add-video">添加视频</button>
        </div>
        
        <div class="input-section">
            <h2>转场效果</h2>
            <select id="transition-type">
                <option value="fade">淡入淡出</option>
                <option value="slideleft">向左滑动</option>
                <option value="slideright">向右滑动</option>
                <option value="slideup">向上滑动</option>
                <option value="slidedown">向下滑动</option>
            </select>
            <label>持续时间（秒）：</label>
            <input type="number" id="transition-duration" min="0.1" max="10" step="0.1" value="1">
        </div>
        <div class="input-section">
            <h2>音频输入</h2>
            <input type="file" id="audio-input" accept="audio/*">
            <div class="volume-control">
                <label>音量：</label>
                <input type="range" id="audio-volume" min="0" max="200" value="100">
                <span id="volume-display">100%</span>
            </div>
        </div>
        
        <div class="button-section">
            <button id="generate-command" hidden>生成FFmpeg命令</button>
            <button id="process-video">处理视频</button>
            <button id="download-video" style="display: none;">下载视频</button>
        </div>
        
        <div class="preview-section">
            <h2>预览</h2>
            <video id="preview-video" controls></video>
        </div>
        
        <!-- <div class="output-section">
            <h2>输出设置</h2>
            <label>输出文件名：</label>
            <input type="text" id="output-filename" value="output.mp4">
            <div class="code-section">
                <h3>FFmpeg命令</h3>
                <pre id="ffmpeg-command"></pre>
            </div>
        </div>
        
        <div id="status" class="status">准备就绪</div> -->
    </div>
    
    <!-- 视频播放弹窗 -->
    <div id="video-modal" class="video-modal">
        <div class="video-modal-content">
            <span class="close-modal">&times;</span>
            <video id="modal-video" controls width="100%" height="auto"></video>
        </div>
    </div>
    
    <!-- 引入FFmpeg.wasm库以支持真实视频处理 -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.0/dist/ffmpeg.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
