<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="视频编辑在线免费工具，支持视频旋转、模糊处理，纯前端处理保护隐私">
    <meta name="keywords" content="视频编辑, 视频旋转, 视频模糊, 在线视频编辑, 免费视频处理">
    <meta name="author" content="余一叶知秋尽">
    <link rel="icon" href="../../common/img/helpoke.webp" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index,follow,noai">
    <title>视频编辑 - 免费在线视频旋转模糊处理工具</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../common/css/style.css">
    <script src="../lib/ffmpeg.js"></script>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "视频编辑工具",
        "description": "免费在线视频编辑工具，支持视频旋转、模糊处理。纯前端处理，保护用户隐私数据。",
        "url": "https://helpoke.com/video/edit",
        "applicationCategory": "https://schema.org/VideoEditing",
        "inLanguage": ["zh-CN", "en-US"],
        "featureList": [
            "支持视频旋转（90度、180度、270度、水平翻转、垂直翻转）",
            "支持视频模糊处理",
            "纯前端处理，视频不上传服务器",
            "实时预览效果",
            "一键下载编辑后的视频"
        ],
        "operatingSystem": "Web",
        "author": {
            "@type": "Organization",
            "name": "Helpoke",
            "url": "https://helpoke.com"
        },
        "offers": {
            "@type": "Offer",
            "price": 0,
            "priceCurrency": "CNY",
            "availability": "https://schema.org/InStock"
        }
    }
    </script>
</head>

<body>
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1><a href="note.html" title="使用说明">视频编辑工具</a>（<a href="/" title="返回首页">🏠</a>）</h1>
            <p>支持<b style="color: cadetblue;">视频旋转</b>和<b style="color: cadetblue;">模糊处理</b>，纯前端处理保护隐私。</p>
            <p class="description">*（<b><em>所有处理均在您本地完成，不会上传网络服务器，无需担忧隐私泄漏。速度取决于您的计算机和浏览器性能</em></b>）</p>
            <p class="description">
                <b>注意：</b> 处理期间切记不要关闭浏览器或刷新页面，否则会导致处理失效、数据丢失，需要重新上传并处理。
            </p>
        </section>
        <div class="container">
            <p class="description">
                <b>注意：</b> 最大支持100MB视频文件。使用FFmpeg引擎进行处理，首次使用需下载约30MB引擎文件。
            </p>

            <div class="upload-section">
                <label for="videoUpload" class="upload-area">
                    <input type="file" id="videoUpload" accept="video/*" hidden>
                    <div class="upload-icon">🎬</div>
                    <div class="upload-text">点击上传或拖拽视频到此处</div>
                    <div class="upload-hint">支持 MP4, WebM, AVI, MOV, MKV 等常见视频格式</div>
                </label>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="video-info" id="videoInfo">
                    <p>请上传视频文件</p>
                </div>
                <div class="video-container">
                    <video id="videoPlayer" controls></video>
                </div>
            </div>

            <div class="settings-section" id="settingsSection" style="display: none;">
                <h3>旋转设置</h3>
                <div class="setting-row">
                    <div class="input-group">
                        <label for="rotation">旋转角度：</label>
                        <select id="rotation">
                            <option value="0">不旋转</option>
                            <option value="90">顺时针旋转 90°</option>
                            <option value="180">旋转 180°</option>
                            <option value="270">顺时针旋转 270° (逆时针90°)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="flipH">水平翻转：</label>
                        <select id="flipH">
                            <option value="0">不翻转</option>
                            <option value="1">水平翻转</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="flipV">垂直翻转：</label>
                        <select id="flipV">
                            <option value="0">不翻转</option>
                            <option value="1">垂直翻转</option>
                        </select>
                    </div>
                </div>

                <h3>模糊设置</h3>
                <div class="setting-row">
                    <div class="input-group">
                        <label for="blurEnable">启用模糊：</label>
                        <select id="blurEnable">
                            <option value="0">不模糊</option>
                            <option value="1">模糊处理</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="blurType">模糊类型：</label>
                        <select id="blurType">
                            <option value="boxblur">方框模糊</option>
                            <option value="gaussian">高斯模糊</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="blurRadius">模糊强度：</label>
                        <select id="blurRadius">
                            <option value="3">轻度 (3)</option>
                            <option value="5" selected>中度 (5)</option>
                            <option value="10">重度 (10)</option>
                            <option value="15">极重度 (15)</option>
                        </select>
                    </div>
                </div>

                <h3>时间范围设置</h3>
                <div class="setting-row">
                    <div class="input-group">
                        <label for="startTime">开始时间（秒）：</label>
                        <input type="number" id="startTime" min="0" step="0.1" value="0" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label for="duration">持续时间（秒）：</label>
                        <input type="number" id="duration" min="0" step="0.1" placeholder="留空表示应用到结束">
                    </div>
                </div>
                <p class="description" style="font-size: 14px; color: #666; margin-top: 10px;">
                    * 效果仅在指定时间段内应用，该时段外视频保持原样。输出视频时长与原视频保持一致。
                </p>

                <div class="action-buttons">
                    <button id="processBtn" disabled>
                        <span id="processBtnText">开始处理</span>
                        <span id="processBtnLoading" style="display: none;">处理中...</span>
                    </button>
                    <div class="progress-container" id="progressContainer" style="display: none;">
                        <div class="progress-bar" id="progressBar"></div>
                        <span class="progress-percentage" id="progressPercentage">0%</span>
                    </div>
                    <p class="process-note" id="processNote" style="display: none;"></p>
                </div>
            </div>

            <div class="output-section" id="outputSection" style="display: none;">
                <h2>处理结果</h2>
                <div class="result-info" id="resultInfo"></div>
                <div class="result-container">
                    <video id="outputVideo" controls></video>
                </div>
                <div class="download-buttons">
                    <button id="downloadBtn">下载处理后视频</button>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>
    </main>

    <script src="../../common/js/theme.js"></script>
    <script src="../../common/js/nav.js"></script>
    <script src="../../common/js/utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
