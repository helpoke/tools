<body>
    <div id="nav-container"></div>

    <main class="main">
        <section class="page-hero">
            <h1>视频转GIF工具（<a href="/" title="返回首页">🏠</a>）</h1>
            <p>从视频中提取精彩片段，制作个性化<b style="color: cadetblue;">GIF动图</b>，支持自定义帧率、尺寸和质量。</p>
            <h1>视频转GIF</h1>
            <p>从视频中提取精彩片段，制作个性化<b style="color: cadetblue;">GIF动图</b>，支持自定义帧率、尺寸和质量。</p>
            <p class="description">*（<b><em>所有处理均在您本地完成，不会上传网络服务器，无需担忧隐私泄漏。所以处理速度取决于您的计算机性能。</em></b>）</p>
            <p class="description">
                <b>注意：</b> 处理期间切记不要关闭浏览器或刷新页面，否则会导致处理失效、数据丢失，需要重新上传并处理。
            </p>
        </section>
        <div class="container">
            <p class="description">
                <b>注意：</b> 最大支持100MB视频文件。建议先裁剪视频到所需片段再转换为GIF。
            </p>

            <div class="upload-section">
                <label for="videoUpload" class="upload-area">
                    <input type="file" id="videoUpload" accept="video/*,.wmv,.avi,.mov,.mkv,.flv" hidden>
                    <div class="upload-icon">🎬</div>
                    <div class="upload-text">点击上传或拖拽视频到此处</div>
                    <div class="upload-hint">支持 MP4, WebM, WMV, AVI, MOV, MKV, FLV, OGV, 3GP 格式</div>
                </label>
            </div>

            <div class="preview-section" id="previewSection">
                <div class="video-info" id="videoInfo">
                    <p>请上传视频文件</p>
                </div>
                <div class="video-container">
                    <video id="videoPlayer" controls></video>
                </div>
            </div>

            <div class="settings-section" id="settingsSection">
                <h3>GIF设置</h3>

                <div class="setting-row">
                    <div class="input-group">
                        <label for="startTime">开始时间 (秒)：</label>
                        <input type="number" id="startTime" min="0" max="3600" value="0" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="duration">持续时长 (秒)：</label>
                        <input type="number" id="duration" min="1" max="60" value="5" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="loopCount">循环次数：</label>
                        <select id="loopCount">
                            <option value="0" selected>无限循环</option>
                            <option value="1">播放1次</option>
                            <option value="2">播放2次</option>
                            <option value="3">播放3次</option>
                            <option value="5">播放5次</option>
                        </select>
                    </div>
                </div>

                <div class="setting-row">
                    <div class="input-group">
                        <label for="frameRate">帧率 (fps)：</label>
                        <select id="frameRate">
                            <option value="5">5 (较低流畅度)</option>
                            <option value="10">10</option>
                            <option value="15" selected>15 (推荐)</option>
                            <option value="20">20</option>
                            <option value="25">25</option>
                            <option value="30">30 (高流畅度)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="quality">GIF质量：</label>
                        <select id="quality">
                            <option value="high">高 (较大文件)</option>
                            <option value="medium" selected>中 (推荐)</option>
                            <option value="low">低 (较小文件)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="scale">尺寸缩放：</label>
                        <select id="scale">
                            <option value="100">原始尺寸</option>
                            <option value="75" selected>75%</option>
                            <option value="50">50%</option>
                            <option value="25">25%</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="convertBtn" disabled>
                        <span id="convertBtnText">生成GIF</span>
                        <span id="convertBtnLoading" style="display: none;">生成中...</span>
                    </button>
                    <div class="progress-container" id="progressContainer" style="display: none;">
                        <div class="progress-bar" id="progressBar"></div>
                        <span class="progress-percentage" id="progressPercentage">0%</span>
                    </div>
                    <p class="convert-note" id="convertNote" style="display: none;"></p>
                </div>
            </div>

            <div class="output-section" id="outputSection">
                <h2>生成结果</h2>
                <div class="result-info" id="resultInfo"></div>
                <div class="result-container">
                    <img id="outputGif" alt="生成的GIF">
                </div>
                <div class="download-buttons">
                    <button id="downloadBtn">下载GIF动图</button>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>

    <script src="../../common/js/theme.js"></script>

</html>
